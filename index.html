<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Einkaufsliste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: eine schmale Spalte wie ein Notizzettel, Eingabe oben, Liste darunter */
  :root {
    --bg: #f3f6f2;
    --surface: #ffffff;
    --fg: #1d2620;
    --muted: #66726a;
    --line: #dde4dc;
    --accent: #2f7a46;
    --accent-fg: #ffffff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121713; --surface: #1b221d; --fg: #e6ece7; --muted: #95a39a;
      --line: #2c372f; --accent: #5cb878; --accent-fg: #0d1a11; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121713; --surface: #1b221d; --fg: #e6ece7; --muted: #95a39a;
    --line: #2c372f; --accent: #5cb878; --accent-fg: #0d1a11; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 34rem;
    margin: 0 auto;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    gap: 20px;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 750;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .count { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }

  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--fg);
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button.add {
    font: inherit;
    font-weight: 600;
    padding: 12px 18px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-fg);
    cursor: pointer;
  }
  button.add:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  ul.items li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    min-height: 52px;
    border-top: 1px solid var(--line);
  }
  ul.items li:first-child { border-top: 0; }
  .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li.done .name { text-decoration: line-through; color: var(--muted); }

  /* Runder Haken-Knopf links: leer = offen, grün gefüllt = erledigt */
  button.check {
    flex: none;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 2px solid var(--line);
    border-radius: 50%;
    background: transparent;
    color: var(--accent-fg);
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  button.check svg { width: 16px; height: 16px; opacity: 0; }
  li.done button.check { background: var(--accent); border-color: var(--accent); }
  li.done button.check svg { opacity: 1; }

  /* Löschen-Knopf rechts */
  button.delete {
    flex: none;
    width: 40px;
    height: 40px;
    margin-right: -8px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  button.delete svg { width: 20px; height: 20px; }
  button.check:focus-visible, button.delete:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty { margin: 0; padding: 28px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Meine Einkaufsliste</h1>
    <p class="count" id="count"></p>
  </header>

  <form id="add-form" autocomplete="off">
    <input type="text" id="item-input" placeholder="z. B. Milch, 2 kg Äpfel" aria-label="Neuer Artikel" enterkeyhint="done">
    <button type="submit" class="add">Hinzufügen</button>
  </form>

  <ul class="items" id="list"></ul>
  <p class="empty" id="empty" hidden>Noch nichts auf der Liste. Tippe oben einen Artikel ein.</p>
</main>

<script>
  // Alle Artikel der Liste. Jeder Artikel hat einen Namen und ist erledigt oder nicht.
  let items = [];

  const CHECK_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  const TRASH_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h13M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5 5.5l.8 10.6a1 1 0 0 0 1 .9h6.4a1 1 0 0 0 1-.9L15 5.5M8.3 9v5M11.7 9v5"/></svg>';

  const form = document.getElementById("add-form");
  const input = document.getElementById("item-input");
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");

  // Zeichnet die Liste neu auf den Bildschirm.
  function render() {
    list.innerHTML = "";
    items.forEach((item, index) => {
      const li = document.createElement("li");
      if (item.done) li.className = "done";

      const check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.innerHTML = CHECK_ICON;
      check.setAttribute("aria-pressed", item.done ? "true" : "false");
      check.setAttribute("aria-label", (item.done ? "Wieder offen: " : "Erledigt: ") + item.name);
      check.addEventListener("click", () => {
        item.done = !item.done;
        render();
      });

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "delete";
      del.innerHTML = TRASH_ICON;
      del.setAttribute("aria-label", "Löschen: " + item.name);
      del.addEventListener("click", () => {
        items.splice(index, 1);
        render();
      });

      li.append(check, name, del);
      list.appendChild(li);
    });
    list.hidden = items.length === 0;
    empty.hidden = items.length !== 0;
    const open = items.filter((item) => !item.done).length;
    const total = items.length === 1 ? "1 Artikel" : items.length + " Artikel";
    count.textContent = items.length ? total + ", davon " + open + " offen" : total;
  }

  // Neuer Artikel über den Knopf "Hinzufügen" oder die Enter-Taste.
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    items.push({ name: name, done: false });
    input.value = "";
    input.focus();
    render();
  });

  render();
</script>
</body>
</html>
